<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AMZ Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background-color: #2b6cb0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333333;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #555555;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .form-group input:focus { border-color: #007bff; outline: none; }
    .error-msg {
      color: #dc3545;
      font-size: 14px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 600;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #28744e;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover { background-color: #1f5c3d; }
    .register-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #666666;
    }
    .register-link a {
      color: #007bff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Sign In</h2>
    <form method="POST">
      {% csrf_token %}
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-submit">Submit</button>
      <div class="register-link">
        Don't have an account? <a href="{% url 'register' %}">Register</a>
      </div>
    </form>
  </div>
</body>
</html>
