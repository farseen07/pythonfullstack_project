<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .register-container {
      background-color: #ffffff;
      padding: 35px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
    }
    .register-container h2 { text-align: center; margin-bottom: 24px; color: #333333; font-size: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; color: #555555; font-size: 14px; font-weight: 600; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .form-group input:focus, .form-group select:focus { border-color: #007bff; outline: none; }
    .error-msg { color: #dc3545; font-size: 14px; margin-bottom: 15px; text-align: center; font-weight: 600; }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover { background-color: #0056b3; }
    .login-link { text-align: center; margin-top: 18px; font-size: 14px; color: #666666; }
    .login-link a { color: #007bff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>Create an Account</h2>
    <form action="{% url 'register' %}" method="POST">
      {% csrf_token %}
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your password" minlength="6" required>
      </div>
      <button type="submit" class="btn-submit">Register</button>
      <div class="login-link">
        Already have an account? <a href="{% url 'login' %}">Sign in</a>
      </div>
    </form>
  </div>
</body>
</html>
